<title>OEE·ONE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: three full-screen scenes crossfade in turn (origin: well-mixed BFF soup;
   map: spatial BFF grid; agents: Geb lattice); a wordmark and one caption per scene. */
:root {
  color-scheme: dark;
  --void: #08090b;
  --lattice: #1b1e24;
  --bone: #ecebe4;
  --signal: #f5d76e;   /* construction arm */
  --strike: #ff2e4d;   /* kill */
  --mate: #f5d76e;     /* reproduction attempt */
  --sp1: #4aa3c8; --sp2: #e0a040; --sp3: #ecebe4;   /* simple, mid, complex networks */
  --noise1: #14161b; --noise2: #1c1f26; --code: #3a3f4b;   /* soup: inert bytes, lone code */
  --fam1: #f5d76e; --fam2: #4aa3c8; --fam3: #e0a040; --fam4: #ecebe4; --fam5: #ff2e4d; --fam6: #7fd1a8;
  --f-pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--bone); }
canvas#field { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
canvas#map { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated;
  image-rendering: crisp-edges; display: block; }
canvas#soup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated;
  image-rendering: crisp-edges; display: block; }
canvas, h1.tag { transition: opacity 1.4s ease; }
html:not(.scene-origin) #soup, html:not(.scene-map) #map, html:not(.scene-agents) #field,
html:not(.scene-origin) h1.origin, html:not(.scene-map) h1.map, html:not(.scene-agents) h1.agents { opacity: 0; }
@media (prefers-reduced-motion: reduce) { canvas, h1.tag { transition: none; } }
.tag { position: fixed; z-index: 2; font-family: var(--f-pixel); text-transform: uppercase; color: var(--bone);
  background: var(--void); line-height: 1; padding: .7em .85em .6em; box-shadow: 0 0 0 2px var(--lattice); }
.mark { top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px));
  font-size: clamp(11px, 0.85vmax, 20px); font-weight: 700; letter-spacing: .18em; }
h1 { margin: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh); left: 50%; transform: translateX(-50%);
  max-width: calc(100vw - 32px); font-weight: 400; font-size: clamp(11px, 1.45vmax, 30px); letter-spacing: .14em;
  text-align: center; text-wrap: balance; }
</style>

<canvas id="field" aria-label="Evolved agents shown as pixel machines: moving, attacking, building offspring and mutating"></canvas>
<canvas id="map" aria-label="A grid of programs on which self-copying families spread outward from where they arose"></canvas>
<canvas id="soup" aria-label="A soup of random programs in which self-copying programs emerge and spread"></canvas>
<div class="tag mark">OEE·ONE</div>
<h1 class="tag origin">Life from random code</h1>
<h1 class="tag map">Life spreads across space</h1>
<h1 class="tag agents">Self-evolving agent civilizations</h1>

<script id="footage" type="application/octet-stream">__FRAMES__</script>
<script id="soupdata" type="application/json">__BFF__</script>
<script id="mapdata" type="application/json">__BFF2D__</script>
<script>
(() => {
  const META = __META__;
  const raw = atob(document.getElementById('footage').textContent.trim());
  const buf = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
  const dv = new DataView(buf.buffer);
  const REC = 10, SLOTS = 512, W = META.L * 64;
  const F = [];
  for (let o = 0; o < buf.length;) {
    const n = dv.getUint16(o, true); o += 2;
    const fr = { list: [], x: new Float32Array(SLOTS), y: new Float32Array(SLOTS), d: new Float32Array(SLOTS),
                 pen: new Int8Array(SLOTS), nn: new Uint8Array(SLOTS), sp: new Uint16Array(SLOTS), has: new Uint8Array(SLOTS) };
    for (let j = 0; j < n; j++, o += REC) {
      const s = dv.getUint16(o, true), v = dv.getUint16(o + 6, true);
      fr.x[s] = dv.getUint16(o + 2, true); fr.y[s] = dv.getUint16(o + 4, true);
      fr.d[s] = v & 511; fr.pen[s] = ((v >> 9) & 3) - 1; fr.nn[s] = v >> 11; fr.sp[s] = dv.getUint16(o + 8, true);
      fr.has[s] = 1; fr.list.push(s);
    }
    F.push(fr);
  }
  const NF = F.length;

  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const VOID = C('--void'), LATTICE = C('--lattice'), BONE = C('--bone'), SIGNAL = C('--signal'),
        STRIKE = C('--strike'), MATE = C('--mate');
  const SPECIES = [C('--sp1'), C('--sp2'), C('--sp3')];
  const species = n => n <= 5 ? 0 : n <= 12 ? 1 : 2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Art grid: 1 art pixel = P screen pixels. One world cell = 9 art pixels.
  const CELL = 9, TILE = META.L * CELL;
  const cv = document.getElementById('field'), g = cv.getContext('2d');
  let P = 4, aw = 0, ah = 0;
  function size() {
    P = Math.max(3, Math.round(Math.max(innerWidth, innerHeight) / 240));
    aw = Math.ceil(innerWidth / P); ah = Math.ceil(innerHeight / P);
    cv.width = aw; cv.height = ah;
    g.imageSmoothingEnabled = false;
    g.fillStyle = VOID; g.fillRect(0, 0, aw, ah);
  }
  addEventListener('resize', size); size();

  // 5x5 left-right symmetric body from a 15-bit genome signature (3 columns x 5 rows).
  const bodyCells = sp => {
    const out = [];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++)
      if (sp >> (r * 3 + c) & 1) { out.push([c - 2, r - 2]); if (c < 2) out.push([2 - c, r - 2]); }
    if (!out.length) out.push([0, 0]);
    return out;
  };
  const cache = new Map();
  const body = sp => { let b = cache.get(sp); if (!b) { b = bodyCells(sp); cache.set(sp, b); } return b; };
  const bitsOf = sp => { const s = new Set(); for (const [x, y] of body(sp)) s.add(x + ',' + y); return s; };

  const wrapd = d => d > W / 2 ? d - W : d < -W / 2 ? d + W : d;
  const toArt = v => v / 64 * CELL;
  let panX = 0, panY = 0;
  function px(ax, ay, color) {  // plot one art pixel at world-art coords on every tile copy
    const ox = Math.floor(panX), oy = Math.floor(panY);
    for (let ty = -TILE; ty < ah + TILE; ty += TILE) for (let tx = -TILE; tx < aw + TILE; tx += TILE) {
      const sx = ((Math.round(ax) + ox) % TILE + TILE) % TILE + tx, sy = ((Math.round(ay) + oy) % TILE + TILE) % TILE + ty;
      if (sx >= 0 && sx < aw && sy >= 0 && sy < ah) { g.fillStyle = color; g.fillRect(sx, sy, 1, 1); }
    }
  }
  function line(x0, y0, x1, y1, color, frac = 1, step = 1) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0, m = Math.round(n * frac);
    for (let i = 0; i <= m; i += step) px(x0 + (x1 - x0) * i / (n || 1), y0 + (y1 - y0) * i / (n || 1), color);
  }

  const events = [];   // {kind, t0, ...}
  const born = new Map(); // slot -> {t0, mut:Set}

  const BASE = reduce ? 0.8 : 2;
  let rate = BASE, target = BASE, simT = 0, last = performance.now(), lastK = -1;
  const hold = on => { target = on ? BASE * 0.15 : BASE; };
  addEventListener('pointerdown', () => hold(true));
  addEventListener('pointerup', () => hold(false));
  addEventListener('pointercancel', () => hold(false));
  addEventListener('keydown', e => { if (e.code === 'Space') { hold(true); e.preventDefault(); } });
  addEventListener('keyup', e => { if (e.code === 'Space') hold(false); });

  const near = (fr, s, x, y, max, pred) => {
    const out = [];
    for (const q of fr.list) {
      if (q === s || (pred && !pred(q))) continue;
      const dx = wrapd(fr.x[q] - x), dy = wrapd(fr.y[q] - y), dd = dx * dx + dy * dy;
      if (dd <= max * max) out.push([dd, q]);
    }
    return out.sort((a, b) => a[0] - b[0]).map(e => e[1]);
  };

  function transition(a, b, now) {
    const A = F[a], B = F[b];
    const newborn = new Set();
    for (const s of B.list) if (!A.has[s]) newborn.add(s);
    // Births: builder is the nearest agent that was trying to reproduce; mutation = body
    // pixels inherited from neither of the two nearest candidates.
    for (const s of newborn) {
      const x = B.x[s], y = B.y[s];
      const cand = near(A, -1, x, y, 64 * 2.5);
      const builder = near(A, -1, x, y, 64 * 1.6, q => A.pen[q] === 1)[0] ?? cand[0];
      const mine = bitsOf(B.sp[s]), mut = new Set(mine);
      for (const q of cand.slice(0, 2)) for (const k of bitsOf(A.sp[q])) mut.delete(k);
      if (cand.length < 2) mut.clear();
      born.set(s, { t0: now, mut });
      if (builder !== undefined)
        events.push({ kind: 'build', t0: now, x0: A.x[builder], y0: A.y[builder],
                      x1: A.x[builder] + wrapd(x - A.x[builder]), y1: A.y[builder] + wrapd(y - A.y[builder]) });
    }
    // Deaths: overwritten by a newborn in the same cell, or struck by an attacker.
    for (const s of A.list) {
      if (B.has[s]) continue;
      const x = A.x[s], y = A.y[s];
      let overwritten = false;
      for (const q of newborn) if (Math.abs(wrapd(B.x[q] - x)) < 33 && Math.abs(wrapd(B.y[q] - y)) < 33) overwritten = true;
      const killer = overwritten ? undefined : near(A, s, x, y, 64 * 1.6, q => A.pen[q] === 2)[0];
      events.push({ kind: overwritten ? 'overwrite' : 'kill', t0: now, x, y, sp: A.sp[s], nn: A.nn[s],
                    kx: killer !== undefined ? A.x[killer] : null, ky: killer !== undefined ? A.y[killer] : null, seed: s * 7919 });
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    rate += (target - rate) * Math.min(1, dt * 4);
    simT += dt * rate;
    if (simT >= NF - 1) { simT = 0; lastK = -1; born.clear(); }
    if (!reduce) { panX += dt * 2.2; panY += dt * 1.1; }
    const k = Math.floor(simT), u = simT - k;
    if (k !== lastK) { if (lastK >= 0 && k === lastK + 1) transition(lastK, k, now); lastK = k; }
    const A = F[k], B = F[k + 1];

    // Decay: older pixels fall back toward the void.
    g.globalAlpha = reduce ? 1 : 0.55; g.fillStyle = VOID; g.fillRect(0, 0, aw, ah); g.globalAlpha = 1;

    // Lattice: one dot per world cell corner.
    for (let cy = 0; cy < META.L; cy++) for (let cx = 0; cx < META.L; cx++) px(cx * CELL, cy * CELL, LATTICE);

    // Events beneath agents.
    for (let i = events.length - 1; i >= 0; i--) {
      const e = events[i], age = (now - e.t0) / 1000;
      if (e.kind === 'build') {
        if (age > 0.5) { events.splice(i, 1); continue; }
        line(toArt(e.x0), toArt(e.y0), toArt(e.x1), toArt(e.y1), SIGNAL, Math.min(1, age / 0.25), 2);
      } else if (e.kind === 'kill') {
        if (age > 1.1) { events.splice(i, 1); continue; }
        if (e.kx !== null && age < 0.3) line(toArt(e.kx), toArt(e.ky), toArt(e.kx + wrapd(e.x - e.kx)), toArt(e.ky + wrapd(e.y - e.ky)), STRIKE);
        // Debris: the body's pixels fly apart.
        let r = e.seed;
        for (const [bx, by] of body(e.sp)) {
          r = (r * 1103515245 + 12345) & 0x7fffffff;
          const vx = bx * 3 + ((r >> 8) % 5 - 2), vy = by * 3 + ((r >> 12) % 5 - 2);
          px(toArt(e.x) + bx + vx * age * 2.2, toArt(e.y) + by + vy * age * 2.2, age < 0.25 ? STRIKE : SPECIES[species(e.nn)]);
        }
      } else {
        if (age > 0.6) { events.splice(i, 1); continue; }
        let r = e.seed;
        for (const [bx, by] of body(e.sp)) {
          r = (r * 1103515245 + 12345) & 0x7fffffff;
          if ((r >> 10) % 100 / 100 > age / 0.6) px(toArt(e.x) + bx, toArt(e.y) + by, LATTICE);
        }
      }
    }
    if (events.length > 800) events.splice(0, events.length - 800);

    // Agents.
    for (const s of A.list) {
      let x = A.x[s], y = A.y[s], d = A.d[s];
      if (B.has[s]) {
        x += wrapd(B.x[s] - x) * u; y += wrapd(B.y[s] - y) * u;
        let dd = B.d[s] - d; if (dd > 180) dd -= 360; if (dd < -180) dd += 360; d += dd * u;
      }
      const ax = Math.round(toArt(x)), ay = Math.round(toArt(y)), col = SPECIES[species(A.nn[s])];
      const b = born.get(s), age = b ? (now - b.t0) / 1000 : 9;
      const rows = age < 0.5 ? Math.floor(age / 0.1) : 5;   // printed row by row
      for (const [bx, by] of body(A.sp[s])) {
        if (by + 2 >= rows) continue;
        const isMut = b && age < 1.4 && b.mut.has(bx + ',' + by);
        px(ax + bx, ay + by, isMut ? (Math.floor(now / 120) % 2 ? BONE : SIGNAL) : col);
      }
      // Arm: the direction it faces. Red while attacking, pink while mating.
      const pen = A.pen[s], len = pen === 2 ? 5 : pen === 1 ? 4 : 3;
      const rad = d * Math.PI / 180, sx = Math.sin(rad), sy = -Math.cos(rad);
      const armCol = pen === 2 ? STRIKE : pen === 1 ? MATE : col;
      for (let i = 3; i <= len; i++) px(ax + sx * i, ay + sy * i, armCol);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>

<script>
// Origin scene: real BFF soup snapshots across the emergence of self-replicators.
// Each 8x8 tile is one 64-byte program; colour = instruction class.
(() => {
  const root = document.documentElement;
  const css = getComputedStyle(root);
  const C = n => css.getPropertyValue(n).trim();
  const hex = c => { const v = parseInt(c.slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; };
  // Byte classes: 0 zero, 1-2 no-op, 3-12 commands. Lone programs: commands grey on static.
  // Programs with many identical copies (replicator families) take their family colour:
  // commands bright, other bytes at 30%.
  const NOISE = [hex(C('--void')), hex(C('--noise1')), hex(C('--noise2'))], CODE = hex(C('--code'));
  const FAM = [1, 2, 3, 4, 5, 6].map(i => hex(C('--fam' + i)));
  const dimc = (c, f) => c.map(v => Math.round(v * f));
  const LAT = hex(C('--lattice'));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SCENES = ['origin', 'map', 'agents'];
  const pinned = SCENES.includes(location.hash.slice(1)) ? location.hash.slice(1) : null;
  const setScene = sc => SCENES.forEach(x => root.classList.toggle('scene-' + x, x === sc));
  setScene(pinned || 'origin');

  const meta = JSON.parse(document.getElementById('soupdata').textContent);
  const P = meta.programs, NF = meta.epochs.length, FB = P * 33;
  const cv = document.getElementById('soup'), g = cv.getContext('2d');
  let frames = null, cols = 48, rows = 27, img = null;
  function layout() {
    cols = Math.max(1, Math.round(Math.sqrt(P * innerWidth / innerHeight)));
    rows = Math.max(1, Math.floor(P / cols));
    cv.width = cols * 9 - 1; cv.height = rows * 9 - 1;
    const s = Math.min(innerWidth / cv.width, innerHeight / cv.height);
    cv.style.width = Math.floor(cv.width * s) + 'px'; cv.style.height = Math.floor(cv.height * s) + 'px';
    img = g.createImageData(cv.width, cv.height);
    for (let i = 0; i < img.data.length; i += 4) { img.data[i] = LAT[0]; img.data[i + 1] = LAT[1]; img.data[i + 2] = LAT[2]; img.data[i + 3] = 255; }
  }
  addEventListener('resize', () => { layout(); last = -1; }); layout();

  let last = -1;
  function draw(k) {
    if (!frames || k === last) return;
    last = k;
    const base = k * FB, d = img.data, W = cv.width;
    for (let p = 0; p < cols * rows && p < P; p++) {
      const ox = (p % cols) * 9, oy = Math.floor(p / cols) * 9;
      const fam = frames[base + p * 33], fc = fam ? FAM[fam - 1] : null, fd = fc ? dimc(fc, 0.3) : null;
      for (let b = 0; b < 64; b++) {
        const byte = frames[base + p * 33 + 1 + (b >> 1)], cls = b & 1 ? byte & 15 : byte >> 4;
        const c = fc ? (cls >= 3 ? fc : fd) : (cls >= 3 ? CODE : NOISE[cls] || NOISE[1]);
        const o = ((oy + (b >> 3)) * W + ox + (b & 7)) * 4;
        d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2];
      }
    }
    g.putImageData(img, 0, 0);
  }

  // Map scene: spatial BFF, one pixel per program (bits 0-2 family, 3-4 background shade).
  const mmeta = JSON.parse(document.getElementById('mapdata').textContent);
  const MW = mmeta.w, MH = mmeta.h, MNF = mmeta.epochs.length;
  const mcv = document.getElementById('map'), mg = mcv.getContext('2d');
  const SHADE = [hex(C('--void')), hex(C('--noise1')), hex(C('--noise2')), hex(C('--lattice'))];
  let mframes = null, mimg = null, mlast = -1, portrait = false;
  function mlayout() {
    portrait = innerHeight > innerWidth;
    mcv.width = portrait ? MH : MW; mcv.height = portrait ? MW : MH;
    const s = Math.max(innerWidth / mcv.width, innerHeight / mcv.height);   // cover the screen
    mcv.style.width = Math.ceil(mcv.width * s) + 'px'; mcv.style.height = Math.ceil(mcv.height * s) + 'px';
    mimg = mg.createImageData(mcv.width, mcv.height);
    mlast = -1;
  }
  if (MNF) { addEventListener('resize', mlayout); mlayout(); }
  function mdraw(k) {
    if (!mframes || k === mlast) return;
    mlast = k;
    const base = k * MW * MH, d = mimg.data;
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      const v = mframes[base + y * MW + x], fam = v & 7;
      const c = fam ? FAM[fam - 1] : SHADE[(v >> 3) & 3];
      const px = portrait ? MH - 1 - y : x, py = portrait ? x : y;
      const o = (py * mcv.width + px) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
    mg.putImageData(mimg, 0, 0);
  }

  const FPS = reduce ? 3 : 8, MFPS = reduce ? 3 : 10, HOLD = 2.5, AGENTS = 22;
  const length = sc => sc === 'origin' ? NF / FPS + HOLD : sc === 'map' ? MNF / MFPS + HOLD : AGENTS;
  const nextScene = sc => {
    let i = SCENES.indexOf(sc);
    for (let n = 0; n < SCENES.length; n++) {
      i = (i + 1) % SCENES.length;
      if (SCENES[i] === 'agents' || (SCENES[i] === 'origin' && frames) || (SCENES[i] === 'map' && mframes)) return SCENES[i];
    }
    return 'agents';
  };
  let t0 = null, slow = 1, slowT = 1, simT = 0, prev = null, phase = pinned || 'origin', phaseT = 0;
  const hold = on => { slowT = on ? 0.15 : 1; };
  addEventListener('pointerdown', () => hold(true));
  addEventListener('pointerup', () => hold(false));
  addEventListener('pointercancel', () => hold(false));
  function tick(now) {
    const dt = prev === null ? 0 : Math.min(0.05, (now - prev) / 1000); prev = now;
    slow += (slowT - slow) * Math.min(1, dt * 4);
    phaseT += dt * slow;
    if (phase === 'origin') draw(Math.min(NF - 1, Math.floor(phaseT * FPS)));
    if (phase === 'map') mdraw(Math.min(MNF - 1, Math.floor(phaseT * MFPS)));
    if (phaseT > length(phase)) {
      phaseT = 0; last = -1; mlast = -1;
      if (!pinned) { phase = nextScene(phase); setScene(phase); }
    }
    requestAnimationFrame(tick);
  }
  const gunzip = b64 => {
    const bin = atob(b64), z = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) z[i] = bin.charCodeAt(i);
    return new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  };
  if (NF) gunzip(meta.data).then(b => { frames = new Uint8Array(b); last = -1; }).catch(() => {});
  if (MNF) gunzip(mmeta.data).then(b => { mframes = new Uint8Array(b); mlast = -1; }).catch(() => {});
  if (!NF && !pinned) { phase = 'agents'; setScene('agents'); }
  requestAnimationFrame(tick);
})();
</script>
